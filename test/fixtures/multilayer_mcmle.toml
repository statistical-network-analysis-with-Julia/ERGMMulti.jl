name = "multilayer_mcmle"

[provenance]
r_version = "4.6.1"
ergm_multi_version = "0.3.0"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261002
script = "test/fixtures/r/multilayer_mcmle.R"
date = "2026-10-07"
model = "Layer(list(A = a, B = b)) ~ L(~edges,~A) + L(~edges,~B) + L(~mutual,~A) + L(~edges,~A&B) + L(~gwesp(0.25,fixed=TRUE),~B) on two seeded 16-actor directed layers (reciprocity in A, overlap between A and B), frozen as edge lists"
estimator = "ergm.multi MCMLE at control.ergm defaults, nine seeds (1..9); hp_* = one fit at MCMC.samplesize=16384, MCMC.interval=4096 (seed 4242); mple_* = estimate=\"MPLE\""

[tolerance]
# Observed statistics are deterministic functions of the layers.
summary_statistics = 1e-10
#
# Both estimators are Monte-Carlo MLEs of the same likelihood, so they are
# compared at R's own resolution. For coefficient k a Julia fit must lie
# within  band_sd * sqrt(sd_k^2 + sd_k^2 / n_seeds)  of R's nine-seed mean,
# where sd_k is R's seed-to-seed standard deviation (`coefficients_sd`):
# the first term is one fit's own Monte-Carlo error (taken equal to R's),
# the second the error of R's mean. The band is floored at
# `floor_se_fraction` of R's mean standard error, so that a coefficient
# whose nine R fits happened to agree unusually closely does not demand more
# than either sampler's O(1/ESS) bias allows. Standard errors likewise,
# against `std_errors_sd`, with the same floor.
band_sd = 4.0
floor_se_fraction = 0.1
# The log-likelihood (bridge / path sampling on both sides): within
# band_sd * sqrt(2) * R's seed-to-seed sd, floored at 1.0 log unit.
loglik_floor = 1.0
# The MPLE is a deterministic function of the change-statistic design:
# the exact refit (glm epsilon 1e-14 on ergmMPLE's design) at 1e-6, the
# as-shipped MPLE at 20x the measured glm slack (mple_vs_exact_coefficients),
# rounded up to a power of ten (no floor). DO NOT LOOSEN.
exact_mple_coefficients = 1e-6
mple_coefficients = 1e-08

