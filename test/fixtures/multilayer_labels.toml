name = "multilayer_labels"

[provenance]
r_version = "4.6.1"
ergm_multi_version = "0.3.0"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261006
script = "test/fixtures/r/multilayer_labels.R"
date = "2026-10-06"
dataset = "deterministic: three directed 8-actor layers friend/advice/cowork and two undirected 8-actor layers a/b, ties arithmetic in the vertex indices; vertex attributes g = rep(a,b,c) and x = (1:8)/2; frozen below as edge lists"
statistics = "summary(Layer(list(friend, advice, cowork)) ~ ...) with layer terms on one layer, pooled over a subset, over every layer and over one layer, both co-occurrence orders, mutualL, and nodefactor/gwesp/nodecov/idegree inside L(); und_: the undirected pair"
model_offset = "ergm(l3 ~ L(~edges,~friend) + L(~edges,~advice) + offset(L(~nodematch(\"g\"),~advice)) + offset(L(~edges,~friend&advice)), offset.coef = c(0.5, 0.2), estimate = \"MPLE\") -- only its coefficient NAMES are frozen"

[tolerance]
# Names are compared exactly. The statistics are exact counts (and a
# geometrically weighted decimal): both sides compute them in closed form.
# DO NOT LOOSEN.
statistics = 1e-10
und_statistics = 1e-10

