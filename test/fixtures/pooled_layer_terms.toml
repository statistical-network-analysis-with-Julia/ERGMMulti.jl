date = "2026-10-07"
dataset = "the SAME directed 20-actor and undirected 12-actor layer pairs as twolayer_layer_terms.toml (identical generating code and seed), plus the deterministic vertex attributes g3 = rep(a,b,c) and x = round(sin(1:n), 3) on both layers; frozen below as edge lists"
statistics = "summary() of L(~term, c(~A, ~B)) for nineteen ergm terms on the directed layers (und_: fifteen on the undirected layers); the pooled statistic is the sum of the per-layer statistics (asserted in the script)"
model_mple = "ergm(lnw ~ L(~edges, c(~A,~B)) + L(~mutual, c(~A,~B)) + L(~gwesp(0.5,fixed=TRUE), c(~A,~B)) + L(~nodematch(\"grp\"), c(~A,~B)) + L(~edges, ~A&B), estimate = \"MPLE\")"
und_model_mple = "ergm(lnu ~ L(~edges, c(~A,~B)) + L(~gwesp(0.5,fixed=TRUE), c(~A,~B)) + L(~nodefactor(\"g3\"), c(~A,~B)) + L(~gwdegree(0.3,fixed=TRUE), ~B) + L(~edges, ~A&B), estimate = \"MPLE\")"
exact_estimator = "the same pseudo-likelihood refit with glm at epsilon = 1e-14 on ergmMPLE(output = \"matrix\")'s own compressed design, since ergm stops its MPLE glm at the default 1e-8"
r_warnings = "none (stopifnot in the script)"

[tolerance]
# The statistics are exact counts (and geometrically weighted decimals):
# both sides compute them in closed form. DO NOT LOOSEN.
statistics = 1e-10
und_statistics = 1e-10
# The MPLE is a deterministic function of the change-statistic design; the
# exact refit (glm epsilon 1e-14 on R's own design) is the assertion with
# teeth. DO NOT LOOSEN.
exact_mple_coefficients = 1e-6
exact_mple_std_errors = 1e-6
und_exact_mple_coefficients = 1e-6
und_exact_mple_std_errors = 1e-6
# As shipped: 20x the measured glm slack (mple_vs_exact_* below), rounded
# up to a power of ten (no floor).
mple_coefficients = 1e-07
mple_std_errors = 0.0001
und_mple_coefficients = 1e-08
und_mple_std_errors = 0.0001

