date = "2026-09-12"
dataset = "the SAME two directed 20-actor layers as twolayer_ergm_multi.toml (identical generating code and seed), wrapped as ergm.multi Layer(list(A = net1, B = net2)); frozen below as edge lists"
statistics = "summary(lnw ~ L(~edges,~A) + L(~edges,~B) + L(~mutual,~A) + L(~triangle,~A) + L(~edges,~A&B) + mutualL(Ls=list(~A,~B)) + L(~gwesp(0.5,fixed=TRUE),~A) + L(~ostar(2),~B) + L(~nodematch(\"grp\"),~B) + L(~twopath,~A))"
model_mple = "ergm(lnw ~ L(~edges,~A) + L(~edges,~B) + L(~edges,~A&B) + L(~mutual,~A), estimate = \"MPLE\") -- DYAD-DEPENDENT (the cross-layer and mutual terms read other dyads), so the MPLE is not the MLE on either side; it is the same deterministic function of the change statistics"
exact_estimator = "the same pseudo-likelihood refit with glm at epsilon = 1e-14 on ergmMPLE(output = \"matrix\")'s own compressed design (response / predictor / weights), since ergm stops its MPLE glm at the default 1e-8"
model_boundary = "ergm(lnb ~ L(~edges,~A) + L(~edges,~B) + L(~edges,~A&B), estimate = \"MPLE\") on the 6-actor cycle/reversed-cycle design where L(A&B)~edges is 0 (its smallest attainable value): ergm.multi warns \"The MPLE does not exist!\" and returns a FINITE coefficient for the boundary term (it does not apply ergm's drop=TRUE to layer terms); ERGMMulti.jl fixes it at -Inf and agrees on the finite coefficients"
und_dataset = "two UNDIRECTED 12-actor layers drawn from the same seed stream immediately after the directed ones (Bernoulli on the unordered pairs i < j at logistic(edges + nodematch * same-grp)), wrapped as Layer(list(A = netA, B = netB)); frozen below as edge lists with i < j"
und_statistics = "summary(lnu ~ L(~edges,~A) + L(~edges,~B) + L(~edges,~A&B) + L(~triangle,~A) + L(~gwesp(0.5,fixed=TRUE),~A) + L(~nodematch(\"grp\"),~B) + L(~kstar(2),~B) + L(~gwdegree(0.3,fixed=TRUE),~B))"
und_model_mple = "ergm(lnu ~ L(~edges,~A) + L(~edges,~B) + L(~edges,~A&B) + L(~triangle,~A), estimate = \"MPLE\") -- DYAD-DEPENDENT, on the unordered within-layer dyads; as shipped and refit exactly (glm epsilon 1e-14) on ergmMPLE(output = \"matrix\")'s design, whose weights sum to 2 * 12 * 11 / 2 = 132"

[tolerance]
# (i) The statistics are exact counts (and the gwesp decay's decimals):
# both sides compute them in closed form. Any disagreement is a wrong
# statistic, not rounding. DO NOT LOOSEN IT.
statistics = 1e-10
#
# (ii) The MPLE is a deterministic function of the change-statistic design:
# no Monte Carlo on either side, so two correct implementations differ only
# in where their optimizers stop. `exact_mple_*` is R's own design refit at
# epsilon = 1e-14, and THAT is the assertion with teeth: 1e-6, ~1e-5 of the
# smallest standard error. If it fails, a change statistic of the
# cross-layer or mutual term (or the dyad universe) is wrong. DO NOT LOOSEN IT.
exact_mple_coefficients = 1e-6
exact_mple_std_errors = 1e-6
#
# Against ergm.multi AS SHIPPED the tolerance must also absorb ergm's own glm
# slack, which `mple_vs_exact_*` in [values] measures; the tolerance is 20x the
# measurement rounded up to a power of ten (floor 1e-6), not hand-chosen.
mple_coefficients = 1e-06
mple_std_errors = 0.0001
#
# (iii) The boundary design's FINITE coefficients are logit(6/18) in closed
# form on both sides (R's glm at epsilon = 1e-8 lands on them to ~1e-9);
# the boundary term itself is where the two packages DIVERGE by design and
# is asserted as -Inf here against R's finite value, not compared.
boundary_finite_coefficients = 1e-6
#
# (iv) The undirected layers: the same three kinds of tolerance as (i)/(ii),
# the as-shipped ones again 20x the measured glm slack.
und_statistics = 1e-10
und_exact_mple_coefficients = 1e-6
und_exact_mple_std_errors = 1e-6
und_mple_coefficients = 1e-06
und_mple_std_errors = 0.001

