# --- (c) the NULL comparison: the same model with NO nodematch at all ---
# This is where a fit lands if the offsets are dropped from the linear
# predictor instead of merely from the parameter vector -- the exact bug an
# offset test is for. The Julia testset asserts its offset fit is NOT this,
# so a test that passed by doing nothing on both sides cannot pass here.
no_nodematch_coefficients = [-1.0296194171811583, -1.7764919968923216]
