n_actors = 20
n_layers = 2
directed = true
grp = ["a", "b", "a", "b", "a", "b", "a", "b", "a", "b", "a", "b", "a", "b", "a", "b", "a", "b", "a", "b"]
edge_counts = [100, 55]
