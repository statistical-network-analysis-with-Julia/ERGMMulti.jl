name = "twolayer_ergm_multi"

[provenance]
r_version = "4.6.1"
ergm_multi_version = "0.3.0"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20260713
script = "test/fixtures/r/twolayer_ergm_multi.R"
date = "2026-07-13"
dataset = "simulated: 2 directed layers on the same 20 actors, alternating two-group `grp`; drawn from the dyad-independent model in [values].generating_* -- the layers themselves are frozen below"
model_free = "Networks(list(net1,net2)) ~ N(~edges + nodematch(\"grp\"), ~factor(.NetworkID) - 1) -- per-layer edges and nodematch, DYAD-INDEPENDENT so ergm fits it by MPLE = exact MLE"
model_offset = "~ N(~edges, ~factor(.NetworkID) - 1) + offset(N(~nodematch(\"grp\"), ~factor(.NetworkID) - 1)), offset.coef = (0.75, 0.40)"
exact_estimator = "the same two logistic regressions refit with glm at epsilon = 1e-14, since ergm stops its MPLE glm at the default 1e-8"

[tolerance]
# Every term here is DYAD-INDEPENDENT, so the likelihood factorizes over the
# (layer, i, j) dyads: ergm's MPLE is the exact MLE and ERGMMulti.jl's MPLE is
# the same exact MLE. There is no Monte Carlo on either side and nothing to
# average over. The only difference two correct implementations can have is
# where their optimizers stop.
#
# `exact_*` below is the same estimator taken to convergence (glm at
# epsilon = 1e-14 rather than ergm's default 1e-8), and THAT is the assertion
# with teeth: 1e-6, which is ~1e-5 of the smallest standard error in the
# model. If it fails, the (layer, i, j) dyad universe or a change statistic is
# wrong. DO NOT LOOSEN IT.
exact_coefficients = 1e-6
exact_std_errors = 1e-6
exact_offset_coefficients = 1e-6
#
# Against ergm.multi AS SHIPPED the tolerance must also absorb ergm's own
# glm slack, which `mple_vs_exact_*` in [values] measures. It is small here
# (unlike the sibling TERGM fixture, where it dominated), but it is measured
# rather than assumed, and the tolerance is set from the measurement.
coefficients = 1e-06
std_errors = 0.0001
offset_coefficients = 1e-06

[values]
