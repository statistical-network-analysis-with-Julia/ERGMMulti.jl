<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="grad-purple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#b57fe3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9558B2;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="grad-red" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#e65c53;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CB3C33;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="grad-green" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#5cb84b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#389826;stop-opacity:1" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode in="offsetblur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="184" height="184" rx="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Layer 1 (back) - Green edges -->
  <line x1="55" y1="55" x2="145" y2="55" stroke="#389826" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="145" y1="55" x2="100" y2="105" stroke="#389826" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="100" y1="105" x2="55" y2="55" stroke="#389826" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Layer 2 (front) - Purple edges -->
  <line x1="65" y1="75" x2="135" y2="75" stroke="#9558B2" stroke-width="3"/>
  <line x1="135" y1="75" x2="100" y2="125" stroke="#9558B2" stroke-width="3"/>
  <line x1="100" y1="125" x2="65" y2="75" stroke="#9558B2" stroke-width="3"/>

  <!-- Interlayer dashed lines -->
  <line x1="55" y1="55" x2="65" y2="75" stroke="#4063D8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="145" y1="55" x2="135" y2="75" stroke="#4063D8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="100" y1="105" x2="100" y2="125" stroke="#4063D8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Layer 1 nodes -->
  <circle cx="55" cy="55" r="10" fill="url(#grad-green)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="145" cy="55" r="10" fill="url(#grad-green)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="100" cy="105" r="10" fill="url(#grad-green)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>

  <!-- Layer 2 nodes -->
  <circle cx="65" cy="75" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="135" cy="75" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="100" cy="125" r="10" fill="url(#grad-purple)" stroke="#fff" stroke-width="2" filter="url(#shadow)"/>

  <!-- Text -->
  <text x="100" y="168" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="1">
    <tspan fill="#9558B2">E</tspan><tspan fill="#CB3C33">R</tspan><tspan fill="#389826">G</tspan><tspan fill="#9558B2">M</tspan><tspan fill="#555">.</tspan><tspan fill="#CB3C33">j</tspan><tspan fill="#389826">l</tspan>
  </text>
  <text x="100" y="182" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="10" fill="#4063D8" letter-spacing="2">MULTI</text>
</svg>
